name: CI — Pull Request

on:
  pull_request:
    branches: [ main, develop ]

jobs:
  build:
    name: 🔍 Verificar PR
    runs-on: ubuntu-latest

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Compilar
        working-directory: ./bitacora
        run: mvn clean compile --no-transfer-progress

      - name: Ejecutar pruebas
        working-directory: ./bitacora
        run: mvn test --no-transfer-progress

      - name: Comentario de éxito en el PR
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '✅ **CI pasó correctamente** — compilación y pruebas exitosas.'
            })

      - name: Comentario de error en el PR
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '❌ **CI falló** — revisa los logs del workflow para más detalles.'
            })