name: CI — Build · Test · Docker Push · Deploy Azure

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

env:
  IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME }}/sakura-api

jobs:

  # ─────────────────────────────────────────────────────────────
  # JOB 1: Compilar, testear y publicar reportes
  # ─────────────────────────────────────────────────────────────
  test:
    name: 🧪 Compilar y probar
    runs-on: ubuntu-latest

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Compilar y ejecutar pruebas
        working-directory: ./bitacora
        run: mvn clean test --no-transfer-progress

      - name: Publicar reporte de pruebas (Surefire)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: bitacora/target/surefire-reports/
          if-no-files-found: ignore

      - name: Publicar reporte de cobertura (JaCoCo)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: bitacora/target/site/jacoco/
          if-no-files-found: ignore

  # ─────────────────────────────────────────────────────────────
  # JOB 2: Construir imagen Docker y publicar en Docker Hub
  # ─────────────────────────────────────────────────────────────
  build-and-push:
    name: 🐳 Construir y publicar imagen Docker
    needs: test
    runs-on: ubuntu-latest
    if: github.event_name == 'push'

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Login a Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Configurar Buildx
        uses: docker/setup-buildx-action@v3

      - name: Metadata de la imagen
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=sha,prefix=sha-,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build y push
        uses: docker/build-push-action@v5
        with:
          context: ./bitacora
          file: ./bitacora/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ─────────────────────────────────────────────────────────────
  # JOB 3: Desplegar en Azure Web App (Contenedor Único)
  # ─────────────────────────────────────────────────────────────
  deploy-azure:
    name: 🚀 Actualizar Azure Web App
    needs: build-and-push
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' # Solo despliega si es push a la rama main

    steps:
      - name: Login en Azure
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}

      - name: Desplegar contenedor en Azure
        uses: azure/webapps-deploy@v2
        with:
          app-name: 'sakura-sushi-api-juan' # Nombre exacto de tu App Service
          images: ${{ env.IMAGE_NAME }}:latest # Le decimos a Azure que use la imagen recién subida