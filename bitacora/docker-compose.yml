version: '3.9'

services:

  # ── API Spring Boot ────────────────────────────────────────────
  api:
    build: .
    container_name: sakura-api
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      JWT_SECRET: VGVzdFNlY3JldEtleVRlc3RTZWNyZXRLZXlUZXN0U2VjcmV0S2V5VGVzdFNlY3JldEtleQ==
    depends_on:
      mongo:
        condition: service_started
    networks:
      - sakura-net

  # ── MongoDB ────────────────────────────────────────────────────
  mongo:
    image: mongo:7
    container_name: sakura-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    networks:
      - sakura-net

  # ── Mongo Express (GUI web para MongoDB) ──────────────────────
  mongo-express:
    image: mongo-express:1.0.2
    container_name: sakura-mongo-express
    ports:
      - "8081:8081"
    environment:
      ME_CONFIG_MONGODB_URL: mongodb://mongo:27017/
      ME_CONFIG_BASICAUTH: "false"
    depends_on:
      - mongo
    networks:
      - sakura-net

volumes:
  mongo-data:

networks:
  sakura-net:
    driver: bridge