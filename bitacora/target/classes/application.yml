spring:
  application:
    name: bitacora-restaurante

  datasource:
    url: jdbc:h2:file:./data/sakura_sushi;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;AUTO_SERVER=TRUE
    username: sa
    password: 
    driver-class-name: org.h2.Driver

  h2:
    console:
      enabled: true
      path: /h2-console
      settings:
        web-allow-others: true

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
    open-in-view: false
  data:
    mongodb:
      uri: mongodb://localhost:27017/sakura_sushi_nosql
      auto-index-creation: true 

server:
  port: 8080

springdoc:
  api-docs:
    path: /v1/api-docs
  swagger-ui:
    path: /swagger-ui.html
    url: /v1/api-docs

logging:
  level:
    root: INFO
    com.restaurante: DEBUG
    org.hibernate.SQL: DEBUG
jwt:
  secret: VGVzdFNlY3JldEtleVRlc3RTZWNyZXRLZXlUZXN0U2VjcmV0S2V5VGVzdFNlY3JldEtleQ==
  expiration-ms: 86400000   # 24 horas en milisegundos