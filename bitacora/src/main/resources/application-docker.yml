spring:
  application:
    name: bitacora-restaurante

  # ── PostgreSQL en Docker ──────────────────────────────────────
  datasource:
    url: jdbc:h2:mem:sakura_sushi;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password: 
    driver-class-name: org.h2.Driver

  h2:
    console:
      enabled: true
      path: /h2-console
      settings:
        web-allow-others: true

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
    open-in-view: false

  # ── MongoDB en Docker (hostname: mongo) ───────────────────────
  data:
    mongodb:
      uri: mongodb://mongo:27017/sakuraSushi
      auto-index-creation: true

server:
  port: 8080

springdoc:
  api-docs:
    path: /v1/api-docs
  swagger-ui:
    path: /swagger-ui.html
    url: /v1/api-docs

jwt:
  secret: VGVzdFNlY3JldEtleVRlc3RTZWNyZXRLZXlUZXN0U2VjcmV0S2V5VGVzdFNlY3JldEtleQ==
  expiration-ms: 86400000

logging:
  level:
    root: INFO
    com.restaurante: INFO