spring:
  application:
    name: bitacora-restaurante

  # ── DataSource: conexión a PostgreSQL ─────────────────────
  datasource:
    url: jdbc:postgresql://localhost:5432/sakura_sushi
    username: postgres
    password: admin1090*
    driver-class-name: org.postgresql.Driver

  # ── JPA / Hibernate ───────────────────────────────────────
  jpa:
    hibernate:
      ddl-auto: update                   # crea/actualiza tablas automáticamente
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
    open-in-view: false

  # ── MongoDB (NoSQL) ───────────────────────────────────────
  data:
    mongodb:
      uri: mongodb://localhost:27017/sakura_sushi_nosql
      auto-index-creation: true
      
server:
  port: 8080

springdoc:
  api-docs:
    path: /v1/api-docs
  swagger-ui:
    path: /swagger-ui.html
    url: /v1/api-docs

logging:
  level:
    root: INFO
    com.restaurante: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.orm.jdbc.bind: TRACE